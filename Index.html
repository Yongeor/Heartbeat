<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>炫酷3D爱心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #000;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        
        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .heart-3d {
            position: relative;
            width: 200px;
            height: 200px;
            transform-style: preserve-3d;
            animation: rotate3d 15s infinite linear;
            margin-bottom: 50px;
        }
        
        .heart-3d:before,
        .heart-3d:after {
            content: "";
            position: absolute;
            width: 105px;
            height: 170px;
            background: linear-gradient(45deg, #ff0066, #ff4da6, #ff0066);
            border-radius: 100px 100px 0 0;
            box-shadow: 
                0 0 20px #ff0066,
                0 0 40px #ff0066,
                inset -5px -5px 10px rgba(255, 0, 102, 0.5);
        }
        
        .heart-3d:before {
            left: 50px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }
        
        .heart-3d:after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }
        
        @keyframes rotate3d {
            0% {
                transform: rotateY(0) rotateX(20deg) scale(1);
            }
            25% {
                transform: rotateY(90deg) rotateX(20deg) scale(1.1);
            }
            50% {
                transform: rotateY(180deg) rotateX(20deg) scale(1);
            }
            75% {
                transform: rotateY(270deg) rotateX(20deg) scale(1.1);
            }
            100% {
                transform: rotateY(360deg) rotateX(20deg) scale(1);
            }
        }
        
        .pulse {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: transparent;
            border: 2px solid #ff0066;
            animation: pulse 3s infinite;
            opacity: 0;
        }
        
        .pulse:nth-child(2) {
            animation-delay: 1s;
        }
        
        .pulse:nth-child(3) {
            animation-delay: 2s;
        }
        
        @keyframes pulse {
            0% {
                transform: scale(0.5);
                opacity: 1;
            }
            100% {
                transform: scale(2.5);
                opacity: 0;
            }
        }
        
        .title {
            color: white;
            font-size: 3rem;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 10px #ff0066, 0 0 20px #ff0066;
            animation: glow 2s infinite alternate;
        }
        
        @keyframes glow {
            from {
                text-shadow: 0 0 10px #ff0066, 0 0 20px #ff0066;
            }
            to {
                text-shadow: 0 0 20px #ff0066, 0 0 30px #ff0066, 0 0 40px #ff0066;
            }
        }
        
        .subtitle {
            color: #ff99cc;
            font-size: 1.2rem;
            text-align: center;
            max-width: 500px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ff0066;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff0066;
            animation: float 10s infinite linear;
        }
        
        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }
        
        .hearts-container {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .floating-heart {
            position: absolute;
            width: 30px;
            height: 26px;
            opacity: 0.7;
            animation: float-heart 15s infinite linear;
        }
        
        .floating-heart:before,
        .floating-heart:after {
            content: "";
            position: absolute;
            width: 15px;
            height: 24px;
            background: #ff4da6;
            border-radius: 15px 15px 0 0;
            box-shadow: 0 0 5px #ff0066;
        }
        
        .floating-heart:before {
            left: 15px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }
        
        .floating-heart:after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }
        
        @keyframes float-heart {
            0% {
                transform: translate(0, 100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translate(calc(100vw - 30px), -100px) rotate(360deg);
                opacity: 0;
            }
        }
        
        .controls {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 0.9rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">永恒之爱</h1>
        <p class="subtitle">爱如星辰，永恒闪耀；心若火焰，永不熄灭。在这浩瀚宇宙中，你是我唯一的光芒。</p>
        
        <div class="heart-3d">
            <div class="pulse"></div>
            <div class="pulse"></div>
            <div class="pulse"></div>
        </div>
        
        <div class="particles" id="particles"></div>
        <div class="hearts-container" id="hearts"></div>
        
        <div class="controls">移动鼠标可产生交互效果</div>
    </div>

    <script>
        // 创建背景粒子
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 100;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // 随机位置和动画延迟
                const left = Math.random() * 100;
                const delay = Math.random() * 10;
                const duration = 10 + Math.random() * 10;
                const size = 2 + Math.random() * 3;
                
                particle.style.left = `${left}vw`;
                particle.style.animationDelay = `${delay}s`;
                particle.style.animationDuration = `${duration}s`;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                particlesContainer.appendChild(particle);
            }
        }
        
        // 创建浮动爱心
        function createFloatingHearts() {
            const heartsContainer = document.getElementById('hearts');
            const heartCount = 15;
            
            for (let i = 0; i < heartCount; i++) {
                const heart = document.createElement('div');
                heart.classList.add('floating-heart');
                
                // 随机位置和动画延迟
                const left = Math.random() * 100;
                const delay = Math.random() * 15;
                const duration = 15 + Math.random() * 10;
                const size = 20 + Math.random() * 20;
                
                heart.style.left = `${left}vw`;
                heart.style.animationDelay = `${delay}s`;
                heart.style.animationDuration = `${duration}s`;
                heart.style.width = `${size}px`;
                heart.style.height = `${size * 0.866}px`;
                
                heartsContainer.appendChild(heart);
            }
        }
        
        // 鼠标交互效果
        document.addEventListener('mousemove', function(e) {
            createInteractiveHeart(e.clientX, e.clientY);
        });
        
        function createInteractiveHeart(x, y) {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            
            heart.style.left = `${x}px`;
            heart.style.top = `${y}px`;
            heart.style.animationDuration = '5s';
            heart.style.opacity = '0.9';
            
            document.getElementById('hearts').appendChild(heart);
            
            // 5秒后移除爱心
            setTimeout(() => {
                heart.remove();
            }, 5000);
        }
        
        // 初始化
        createParticles();
        createFloatingHearts();
        
        // 添加点击效果
        document.addEventListener('click', function(e) {
            createClickEffect(e.clientX, e.clientY);
        });
        
        function createClickEffect(x, y) {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    createInteractiveHeart(x + Math.random() * 50 - 25, y + Math.random() * 50 - 25);
                }, i * 100);
            }
        }
    </script>
</body>
</html>
